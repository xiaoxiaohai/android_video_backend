# console.nexamedia.app — Admin UI
# Proxies to the same backend as api.nexamedia.app.
# Root "/" redirects to "/admin/" where the Vue SPA lives.

server {
  listen 80;
  listen [::]:80;

  server_name console.nexamedia.app;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name console.nexamedia.app;

  ssl_certificate     /etc/letsencrypt/live/nexamedia.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nexamedia.app/privkey.pem;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # Redirect bare root to /admin/
  location = / {
    return 302 /admin/;
  }

  # Everything else → backend
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
